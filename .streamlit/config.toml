# Theme du dashboard Process Mining PME.
#
# Palette reprise du guide Power BI du projet (meme ambre/teal/encre) pour une
# identite visuelle coherente entre les livrables du stage, plutot que le bleu
# Streamlit par defaut qui se reconnait instantanement comme un template non
# personnalise.

[theme]
base = "light"
primaryColor = "#b3791f"           # ambre - boutons, sliders, elements actifs
backgroundColor = "#ffffff"        # zone de contenu principale
secondaryBackgroundColor = "#f3f5f7"  # barre laterale, cartes, widgets
textColor = "#1b2430"              # encre, jamais un noir pur
font = "sans serif"

[server]
headless = true

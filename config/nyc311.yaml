# Configuration du flux vivant NYC 311 (reclamations citoyennes).
#
# Meme structure que bpi2019.yaml : c'est la demonstration que la plateforme
# analyse un nouveau processus sans une seule ligne de code modifiee.

name: nyc311
label: "Traitement de reclamations (API NYC 311)"
description: >
  Cycle de vie d'un ticket de reclamation : ouverture, mise a jour de
  l'action de resolution, cloture. Source vivante interrogee via API.

columns:
  case_id: "case_id"
  activity: "activity"
  timestamp: "timestamp"
  resource: "agency"

terminal_activities:
  - "Service Request Closed"

attributes:
  amount: null
  categorical:
    - "complaint_type"
    - "descriptor"
    - "agency"
    - "borough"

analysis:
  discovery_top_k_variants: 20
  min_transition_count: 20
  late_quantile: 0.75
